[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient
    adafruit/Adafruit INA219
    olikraus/U8g2
    Keypad
    bblanchon/ArduinoJson